{{- $src := .Get "src" | relURL -}}
<object class="pdf-embed" data="{{ $src }}" type="application/pdf">
    <p>Your browser cannot display PDFs inline. <a href="{{ $src }}">Download the PDF</a> instead.</p>
</object>
<style>
    .pdf-embed {
        width: 100%;
        height: 80vh;
        border: 1px solid var(--border);
        border-radius: var(--radius);
    }

    /* Mobile browsers render an empty box instead of the fallback, so hide it
       and let the download link in the page body do the work. */
    @media (max-width: 768px) {
        .pdf-embed { display: none; }
    }
</style>
